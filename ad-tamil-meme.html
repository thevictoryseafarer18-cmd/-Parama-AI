<!DOCTYPE html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parama – Placement meme ad</title>
<style>
:root{box-sizing:border-box;--bg:#fff7e6;--tx:#1b1b1b;--card:#fff;--pri:#1f5f5b;--onp:#fff;--mut:#555;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14100a;--tx:#f5efe3;--card:#221b10;--pri:#7fd6ce;--onp:#003733;--mut:#bfb6a3}}
:root[data-theme="dark"]{--bg:#14100a;--tx:#f5efe3;--card:#221b10;--pri:#7fd6ce;--onp:#003733;--mut:#bfb6a3}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;margin:.2em 0;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.panel{position:relative;border-radius:16px;overflow:hidden;border:3px solid #111;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;padding:10px}
.p1{background:linear-gradient(160deg,#ffb347,#ff6f61)}.p2{background:linear-gradient(160deg,#8ec5fc,#6a85f1)}
.p3{background:linear-gradient(160deg,#c3f584,#3fb27f)}.p4{background:linear-gradient(160deg,#f6d365,#fda085)}
.cap{font:900 1.15rem/1.25 Impact,"Arial Black","Noto Sans Tamil",sans-serif;color:#fff;text-align:center;text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000;margin:4px 0}
.art{display:flex;justify-content:center;align-items:flex-end;gap:6px}.art svg{width:150px;height:auto}.art.row svg{width:30%}
.bubble{position:relative;align-self:center;background:#fff;color:#111;border:3px solid #111;border-radius:16px;padding:8px 12px;font-weight:700;max-width:92%;text-align:center}
.tag{position:absolute;top:8px;right:8px;background:#111;color:#fff;border-radius:99px;padding:2px 10px;font-size:.7rem;font-weight:700}
.cta{margin:18px 0 8px;text-align:center}
button,a.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:2px solid var(--pri);background:var(--pri);color:var(--onp);padding:12px 20px;min-height:44px;text-decoration:none;display:inline-block;margin:4px}
button.o{background:transparent;color:var(--pri)}
button:focus-visible,a.btn:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.fine{font-size:.78rem;color:var(--mut);text-align:center;margin-top:10px}
.toast{text-align:center;font-weight:700;min-height:1.5em}
.rays .panel::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,255,255,.25) 0 8deg,transparent 8deg 16deg)}
.rays .panel>*:not(.tag){position:relative;z-index:1}
.slot{margin:10px 0;font-size:.9rem}
.ph{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #fff}
</style></head><body><main>
<h1>😂 Placement Season Survival Kit</h1>
<p class="sub">Ad concept for <b>Parama</b> – the career companion for college students</p>
<div class="grid" id="grid"></div>
<div class="cta">
<button id="share">Share this ad</button>
<button class="o" id="shuffle">Shuffle the jokes</button>
<div class="slot"><label><input type="checkbox" id="ok"> I have permission to use this person's photo</label><br><input type="file" id="pic" accept="image/*" aria-label="Choose a photo you have permission to use"> <button class="o" id="clear">Remove photo</button></div>
<div class="toast" id="toast" role="status"></div>
</div>
<p class="fine">Original jokes, no film templates or real people. Parama gives guidance, not job guarantees. Sample ad concept; wording may need a native-Tamil proofread before launch.</p>
</main>
<script>
const FACES={
tired:`<circle cx="52" cy="56" r="6" fill="#fff"/><circle cx="78" cy="56" r="6" fill="#fff"/><circle cx="53" cy="58" r="2.5" fill="#222"/><circle cx="77" cy="58" r="2.5" fill="#222"/><path d="M45 66q7 4 14 0M71 66q7 4 14 0" stroke="#8a5a3a" stroke-width="2" fill="none"/><path d="M54 80h22" stroke="#222" stroke-width="3" stroke-linecap="round"/>`,
panic:`<circle cx="52" cy="54" r="8" fill="#fff"/><circle cx="78" cy="54" r="8" fill="#fff"/><circle cx="52" cy="55" r="2.5" fill="#222"/><circle cx="78" cy="55" r="2.5" fill="#222"/><path d="M42 40l16 5M88 40l-16 5" stroke="#222" stroke-width="3" stroke-linecap="round"/><ellipse cx="65" cy="78" rx="8" ry="10" fill="#7a1f1f"/><path d="M98 36q5 8 0 12q-5-4 0-12z" fill="#6ec1ff"/>`,
smug:`<circle cx="52" cy="56" r="9" fill="none" stroke="#222" stroke-width="3"/><circle cx="78" cy="56" r="9" fill="none" stroke="#222" stroke-width="3"/><path d="M61 56h8" stroke="#222" stroke-width="3"/><circle cx="52" cy="57" r="2.5" fill="#222"/><circle cx="78" cy="57" r="2.5" fill="#222"/><path d="M52 74q13 12 26 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`,
happy:`<path d="M44 56q8-8 16 0M70 56q8-8 16 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M48 72q17 18 34 0z" fill="#7a1f1f" stroke="#222" stroke-width="2"/>`};
const EX={
mug:`<rect x="102" y="104" width="26" height="28" rx="4" fill="#fff" stroke="#333" stroke-width="3"/><path d="M128 111q12 2 0 14" stroke="#333" stroke-width="3" fill="none"/><path d="M110 98q-4-8 2-12M120 98q-4-8 2-12" stroke="#999" stroke-width="2" fill="none"/>`,
papers:`<g fill="#fff" stroke="#999"><rect x="4" y="20" width="22" height="28" transform="rotate(-20 15 34)"/><rect x="104" y="14" width="22" height="28" transform="rotate(25 115 28)"/><rect x="2" y="90" width="22" height="28" transform="rotate(15 13 104)"/></g>`,
board:`<rect x="96" y="96" width="40" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="3"/><text x="116" y="123" font-size="22" text-anchor="middle">📧</text>`,
cv:`<rect x="100" y="96" width="30" height="40" rx="3" fill="#fff" stroke="#333" stroke-width="3"/><path d="M106 108h18M106 116h18M106 124h12" stroke="#1f5f5b" stroke-width="3"/>`,
none:``};
const C=(shirt,tie,skin,hair,face,ex)=>`<svg viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="30" y="92" width="70" height="58" rx="16" fill="${shirt}"/><rect x="58" y="92" width="14" height="18" fill="#fff"/><path d="M65 94l-6 28 6 8 6-8z" fill="${tie}"/><circle cx="65" cy="56" r="34" fill="${skin}"/><path d="M30 52c2-30 68-32 70 0-14-12-56-12-70 0z" fill="${hair}"/>${FACES[face]}${EX[ex]}</svg>`;
const A=f=>C('#3b6ea8','#d32f2f','#f1c27d','#3b2a1a',f,'mug'),B=f=>C('#a8503b','#ffcc00','#c68642','#1b1b1b',f,'papers'),M=f=>C('#5a4a8a','#1f5f5b','#ffdbac','#8a5a2b',f,'board');

// Original jokes (Tanglish + Tamil). Each panel: [tag, top caption, art, bottom caption, Parama bubble]
const SETS=[
[
 ['Placement season','Resume-la "Hardworking" nu pottutu…',B('panic'),'Project-la "Hello World" dhaan da! 😭','Parama: Unga profile-la irukkurathu mattum vechu resume draft pannum. Poi ezhudhaadhu!'],
 ['CGPA scene','CGPA 6.9, cutoff 7.0…',A('tired'),'0.1-ku oru life-aa bro?!','Parama: Scale-a nee choose pannu, college-ku college maarum. Formula-yum kaattuvom.'],
 ['Interview','"Tell me about yourself"',M('smug'),'Naan: Naan oru… oru… (brain buffering…)','Parama: Munnadiye practice pannu machi. Questions ready, feedback ready.'],
 ['Parama','உன் கேரியருக்கு ஒரு நண்பன்',C('#1f5f5b','#ffcc00','#f1c27d','#222','happy','cv'),'Resume ready ✓ Roadmap ready ✓ Coffee ready ✓','Job guarantee illa da – aana plan irukku! Parama try pannunga.']
],
[
 ['Deadline','Deadline: naalaiku.',B('panic'),'Naan: Naalaiku start pannuren 😎','Parama: Applications tracker-la deadline vechukko. Reminder-ku munnadi plan.'],
 ['Meeting','Intha meeting-a email-aa anuppi irukkalaam…',M('smug'),'Naanum placement-ku ready aagalaam 😅','Parama: Oru roadmap, oru step. Skill gap-a paaru, project pannu.'],
 ['Resume','"Proficient in Excel"',A('tired'),'Reality: Oru thadava VLOOKUP google pannen','Parama: Unmaiya ezhudhu, nalla ezhudhu. Naan invent pannaadhu.'],
 ['Parama','Machi, career-ku GPS venum-aa?',C('#1f5f5b','#ffcc00','#f1c27d','#222','happy','cv'),'Profile → Resume → Roadmap → Apply (nee confirm pannu)','Parama – student-oda career companion. Try pannunga!'],[
 ['Mass entry','Placement hall-ku naan entry…',A('smug'),'Slow motion-la nadandhen. Resume-a marandhutten 😎','Parama: Entry-ku munnadi resume ready pannu. 2 minutes-la draft, nee edit pannu.'],
 ['Hero intro','Oru student. Oru dream. Oru arrear.',B('tired'),'Plot twist: Oru plan! 💪','Parama: Roadmap-la skill gap paaru, step by step.'],
 ['Friend','"Machi, naalaiku padikkalaam"',M('smug'),'Naalaiku = placement day 😭','Parama: Tracker-la deadline vechukko. Naalaiku-nu thalli podaadhey.'],
 ['Parama','Mass hero aaganum-na, prepare aagu!',C('#1f5f5b','#ffcc00','#f1c27d','#222','happy','cv'),'Entry-ku munnadi Parama 🔥','Job guarantee illa – aana confidence irukku. Try pannunga!']
]];
let set=2,photo='';
function draw(){document.getElementById('grid').className='grid'+(set==2?' rays':'');document.getElementById('grid').innerHTML=SETS[set].map((p,i)=>`<section class="panel p${i+1}"><span class="tag">${p[0]}</span><div class="cap" style="margin-top:26px">${p[1]}</div><div class="art">${i==0&&photo?`<img class="ph" alt="Photo provided by the advertiser, used with permission" src="${photo}">`:p[2]}</div><div class="cap">${p[3]}</div><div class="bubble">${p[4]}</div></section>`).join('')}
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;setTimeout(()=>t.textContent='',3000)};
document.getElementById('shuffle').onclick=()=>{set=(set+1)%SETS.length;draw()};
document.getElementById('share').onclick=()=>{
 const text='Parama – Placement Season Survival Kit 😂\n'+SETS[set].map(p=>`• ${p[1]} → ${p[3]}`).join('\n')+'\n\nParama: career companion for college students (guidance, not job guarantees).';
 if(navigator.share){navigator.share({title:'Parama ad',text}).catch(()=>{})}
 else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Copied! Paste it in your group 😄'),()=>toast('Copy failed.'))}
 else toast('Sharing is not supported in this browser.')};
document.getElementById('pic').onchange=e=>{const f=e.target.files[0];if(!f)return;
if(!document.getElementById('ok').checked){toast('Please confirm you have permission first.');e.target.value='';return}
if(!f.type.startsWith('image/')||f.size>4e6){toast('Choose an image under 4 MB.');e.target.value='';return}
const r=new FileReader();r.onload=()=>{photo=r.result;draw();toast('Photo added to panel 1. It stays on your device.')};r.readAsDataURL(f)};
document.getElementById('clear').onclick=()=>{photo='';document.getElementById('pic').value='';draw()};
draw();
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parama – AI career companion</title>
<style>
:root{box-sizing:border-box;--bg:#f6faf9;--card:#fff;--tx:#161d1c;--mut:#4a5856;--pri:#1f5f5b;--onp:#fff;--pc:#cdebe7;--bd:#d5e2e0;--warn:#ffe9a8;--wt:#3b2f00;--red:#d32f2f;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--card:#182120;--tx:#e6efee;--mut:#a9bab7;--pri:#7fd6ce;--onp:#003733;--pc:#00504b;--bd:#2a3a38;--warn:#574500;--wt:#ffe9a8}}
:root[data-theme="dark"]{--bg:#0f1514;--card:#182120;--tx:#e6efee;--mut:#a9bab7;--pri:#7fd6ce;--onp:#003733;--pc:#00504b;--bd:#2a3a38;--warn:#574500;--wt:#ffe9a8}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.15rem;margin:1em 0 .4em}p{margin:.3em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.pc{background:var(--pc)}.mut{color:var(--mut);font-size:.88rem}
.badge{display:inline-block;background:var(--warn);color:var(--wt);border-radius:99px;padding:1px 8px;font-size:.7rem;font-weight:700}
.ai{color:var(--pri);font-size:.75rem;font-weight:600}
label{display:block;font-size:.85rem;margin:10px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:80px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--pri);background:transparent;color:var(--pri);padding:9px 14px;min-height:44px}
button.p{background:var(--pri);color:var(--onp)}button.w{width:100%;margin-top:8px}button.t{border-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;font-size:.72rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:0}
nav button.on{color:var(--pri);font-weight:700}nav span{font-size:1.2rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap;min-height:36px;padding:4px 12px;border-radius:99px}
.chips button.on{background:var(--pc);font-weight:700}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;margin:8px 0;white-space:pre-wrap}
.me{margin-left:auto;background:var(--pc)}.bot{background:var(--card);border:1px solid var(--bd)}
.rec{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:600}.dot{width:12px;height:12px;border-radius:50%;background:var(--red);animation:b 1s infinite}
@keyframes b{50%{opacity:.3}}
.warn{background:var(--warn);color:var(--wt);border-radius:10px;padding:10px;margin:8px 0;font-size:.9rem}
.card:not(.pc):not(.mas){background:color-mix(in srgb,var(--card) 90%,transparent)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgc{position:absolute;width:170px;opacity:.16}
.dd{position:absolute;font-size:1.8rem;opacity:.1;animation:fl 8s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.dd{animation:none}}
.mas{display:flex;align-items:center;gap:12px;background:var(--pc)}
.mc{width:96px;flex:none}.mc svg{width:100%;height:auto;display:block}
.bub{position:relative;background:var(--card);border:2px solid var(--tx);border-radius:16px;padding:10px 12px;font-weight:600;flex:1}
.bub:before{content:"";position:absolute;left:-10px;top:26px;border:8px solid transparent;border-right-color:var(--tx);border-left:0}
</style></head><body><div class="bg" id="bg" aria-hidden="true"></div><div id="app"></div><nav id="nav" aria-label="Main"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const csv=s=>String(s||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
const SAMPLE_P={name:'Meera Krishnan',college:'Sample Institute of Technology',degree:'B.Tech',branch:'Computer Science',year:'3rd year',skills:['Kotlin','Python','SQL','Git','Data Structures'],roles:['Android Developer','Data Analyst'],locations:['Chennai','Remote'],cgpa:'8.4',goal:'Land an Android developer internship for summer 2027',exp:'Campus Event Finder (Kotlin, team of 3): Android app listing college events.\nCoding club volunteer: ran weekly practice sessions.'};
const O=[
['s1','Android Developer Intern','Northwind Apps','Chennai','Hybrid','Internship','B.Tech/BE, 3rd–4th year, Kotlin basics','2026-11-15'],
['s2','Data Analyst Intern','Contoso Insights','Bengaluru','On-site','Internship','Any branch, SQL + Excel','2026-11-30'],
['s3','Software Engineer (Campus Hire)','Fabrikam Systems','Hyderabad','On-site','Job','Final year, CGPA cutoff per employer','2026-12-10'],
['s4','Remote Python Intern','Globex Labs','Remote','Remote','Internship','2nd year onwards, Python','2026-12-01'],
['s5','UX Design Intern','Initech Studio','Chennai','Hybrid','Internship','Portfolio with 2 case studies','2026-11-20'],
['s6','Campus Coding Hackathon','Umbrella Tech Club','Pune','On-site','Hackathon','Teams of 2–4 students','2026-10-28']
].map(a=>({id:a[0],title:a[1],org:a[2]+' (fictional)',loc:a[3],mode:a[4],type:a[5],elig:a[6],dl:a[7],src:'Sample dataset',checked:'2026-10-01 (sample)'}));
const STAT=['Saved','Preparing','Ready to review','Applied','Interview','Closed'];
const PATHS=[['Android Developer',['Kotlin','Jetpack Compose','Git','REST APIs','Data Structures']],['Data Analyst',['SQL','Excel','Python','Statistics','Data Visualization']],['Software Developer',['Data Structures','Git','SQL','Python','Problem Solving']],['UX Designer',['Figma','User Research','Prototyping']]];
let S={p:null,saved:[],grades:[],chat:[],resume:null,tab:'home',plus:false,vers:[],iv:null,jdr:null,cover:'',freeRole:'',f:{q:'',type:'All',mode:'All'},draft:'',scale:'10',edit:null,listening:false,read:false,msg:''};
try{const r=JSON.parse(localStorage.getItem('parama')||'null');if(r)Object.assign(S,{p:r.p,saved:r.saved||[],grades:r.grades||[],resume:r.resume||null,plus:!!r.plus,vers:r.vers||[],freeRole:r.freeRole||''})}catch(e){}
const save=()=>{try{localStorage.setItem('parama',JSON.stringify({p:S.p,saved:S.saved,grades:S.grades,resume:S.resume,plus:S.plus,vers:S.vers,freeRole:S.freeRole}))}catch(e){}};
const go=t=>{S.tab=t;render();window.scrollTo(0,0)};
const toast=m=>{S.msg=m;render();setTimeout(()=>{S.msg='';render()},3500)};

// ---------- comic office characters (original SVG art)
const FACES={
tired:`<circle cx="52" cy="56" r="6" fill="#fff"/><circle cx="78" cy="56" r="6" fill="#fff"/><circle cx="53" cy="58" r="2.5" fill="#222"/><circle cx="77" cy="58" r="2.5" fill="#222"/><path d="M45 66q7 4 14 0M71 66q7 4 14 0" stroke="#8a5a3a" stroke-width="2" fill="none"/><path d="M54 80h22" stroke="#222" stroke-width="3" stroke-linecap="round"/>`,
panic:`<circle cx="52" cy="54" r="8" fill="#fff"/><circle cx="78" cy="54" r="8" fill="#fff"/><circle cx="52" cy="55" r="2.5" fill="#222"/><circle cx="78" cy="55" r="2.5" fill="#222"/><path d="M42 40l16 5M88 40l-16 5" stroke="#222" stroke-width="3" stroke-linecap="round"/><ellipse cx="65" cy="78" rx="8" ry="10" fill="#7a1f1f"/><path d="M98 36q5 8 0 12q-5-4 0-12z" fill="#6ec1ff"/>`,
smug:`<circle cx="52" cy="56" r="9" fill="none" stroke="#222" stroke-width="3"/><circle cx="78" cy="56" r="9" fill="none" stroke="#222" stroke-width="3"/><path d="M61 56h8" stroke="#222" stroke-width="3"/><circle cx="52" cy="57" r="2.5" fill="#222"/><circle cx="78" cy="57" r="2.5" fill="#222"/><path d="M52 74q13 12 26 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`};
const EXTRA={
mug:`<rect x="102" y="104" width="26" height="28" rx="4" fill="#fff" stroke="#333" stroke-width="3"/><path d="M128 111q12 2 0 14" stroke="#333" stroke-width="3" fill="none"/><path d="M110 98q-4-8 2-12M120 98q-4-8 2-12" stroke="#999" stroke-width="2" fill="none"/>`,
papers:`<g fill="#fff" stroke="#999"><rect x="4" y="20" width="22" height="28" transform="rotate(-20 15 34)"/><rect x="104" y="14" width="22" height="28" transform="rotate(25 115 28)"/><rect x="2" y="90" width="22" height="28" transform="rotate(15 13 104)"/></g>`,
board:`<rect x="96" y="96" width="40" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="3"/><text x="116" y="123" font-size="22" text-anchor="middle">📧</text>`};
const CHARS=[
{shirt:'#3b6ea8',tie:'#d32f2f',skin:'#f1c27d',hair:'#3b2a1a',face:'tired',extra:'mug',alt:'Tired office worker holding a coffee mug'},
{shirt:'#a8503b',tie:'#ffcc00',skin:'#c68642',hair:'#1b1b1b',face:'panic',extra:'papers',alt:'Panicking office worker with flying papers'},
{shirt:'#5a4a8a',tie:'#1f5f5b',skin:'#ffdbac',hair:'#8a5a2b',face:'smug',extra:'board',alt:'Smug office worker next to a whiteboard with an email icon'}];
const svgChar=c=>`<svg viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${c.alt}"><rect x="30" y="92" width="70" height="58" rx="16" fill="${c.shirt}"/><rect x="58" y="92" width="14" height="18" fill="#fff"/><path d="M65 94l-6 28 6 8 6-8z" fill="${c.tie}"/><circle cx="65" cy="56" r="34" fill="${c.skin}"/><path d="M30 52c2-30 68-32 70 0-14-12-56-12-70 0z" fill="${c.hair}"/>${FACES[c.face]}${EXTRA[c.extra]}</svg>`;
const JOKES=[[2,'This meeting could\'ve been an email.'],[1,'Deadline: tomorrow. Me: starting tomorrow.'],[0,'Entry-level job: "5 years experience required". Me: 🙂'],[0,'"Proficient in Excel" ≠ "Googled VLOOKUP once".'],[2,'Interview tip: never say "I\'m a perfectionist". Say something true.'],[1,'Update resume? Sure, right after I clean my desk. And the fridge.']];
function mascot(){const j=JOKES[(S.joke||0)%JOKES.length];return`<div class="card mas"><div class="mc">${svgChar(CHARS[j[0]])}</div><div class="bub"><div>${esc(j[1])}</div><button class="t" onclick="S.joke=(S.joke||0)+1;render()">😄 Another one</button></div></div>`}
function bgHtml(){const pos=[['left:-24px;bottom:70px;transform:rotate(-8deg)',0],['right:-20px;top:90px;transform:rotate(7deg)',1],['left:-30px;top:38%;transform:rotate(10deg)',2],['right:-26px;bottom:110px;transform:rotate(-6deg)',0]];return pos.map(p=>`<div class="bgc" style="${p[0]}">${svgChar(CHARS[p[1]])}</div>`).join('')+['☕','📎','📧','💼','🗂️','⏰'].map((e,i)=>`<span class="dd" style="left:${12+i*15}%;top:${(i*37)%80+8}%">${e}</span>`).join('')}

// ---------- logic
function reply(q){const p=S.p,t=q.toLowerCase(),role=p.roles[0]||'your target role',sk=p.skills.slice(0,4).join(', ')||'the skills you add to your profile';
if(/resume|\bcv\b/.test(t))return`For a ${role} resume, open with a 2-line summary, then projects that show ${sk}. Use numbers only when they're real and verifiable. Draft one in Profile → Resume builder and edit every line.`;
if(/interview|question/.test(t))return`Practice questions for ${role}:\n1. Walk me through a project you're proud of. What was your part?\n2. How would you debug something that works on your laptop but fails elsewhere?\n3. Explain a core concept from your coursework simply.\nAnswer in ~90 seconds each, then send me your answer and I'll suggest improvements.`;
if(/intern|placement|job/.test(t))return`For ${role}, use Explore to filter by type and location. Save a few, confirm eligibility yourself, and tailor one resume per role. Placements are competitive, so treat this as a plan, not a promise.`;
if(/skill|learn|roadmap|gap/.test(t))return`Check Explore → Roadmap to compare your skills with ${role} requirements. Pick one gap, learn it, and prove it with a small project.`;
if(/cgpa|gpa|grade/.test(t))return`Use the CGPA calculator in Profile and pick your college's scale, since scales differ. CGPA is one signal; projects and skills matter too.`;
return`Your goal: "${p.goal||'not set yet'}". A good next step this week: improve one resume section, save two opportunities, or practice one interview question. Tell me which and I'll help.`}
function ask(q){q=q.trim();if(!q)return;if(!S.plus&&S.chat.filter(m=>m.me).length>=5){toast('You have used your 5 free AI questions. Parama Plus removes the limit.');go('plus');return}S.chat.push({me:1,t:q});S.draft='';render();
setTimeout(()=>{const r=reply(q);S.chat.push({t:r});render();if(S.read)speak(r)},500)}
function speak(t){if(!('speechSynthesis' in window)){toast('Read-aloud isn\'t available in this browser.');return}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}
let rec=null;
function mic(){if(S.listening){cancelMic();return}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){toast('Voice input isn\'t supported in this browser. Please type your question.');return}
if(!confirm('Use the microphone?\n\nParama listens only while the red "Listening" indicator is on. Your browser\'s speech service may send audio to its provider. You can review and edit the text before sending.'))return;
rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=false;
rec.onresult=e=>{S.draft=e.results[0][0].transcript;S.listening=false;render()};
rec.onerror=e=>{S.listening=false;render();toast(e.error==='not-allowed'?'Microphone permission was denied. You can still type.':'Voice input had a problem. You can type instead.')};
rec.onend=()=>{if(S.listening){S.listening=false;render()}};
try{rec.start();S.listening=true;render()}catch(e){toast('Could not start voice input.')}}
function cancelMic(){try{rec&&rec.abort()}catch(e){}S.listening=false;render()}
function genResume(){const p=S.p,role=($('#role')||{}).value.trim();if(!role){toast('Enter a target role first.');return}
if(!S.plus){if(S.freeRole&&S.freeRole.toLowerCase()!==role.toLowerCase()){toast('Free plan has one resume target ('+S.freeRole+'). Tailored versions for other roles are in Parama Plus.');return}S.freeRole=role}
const keys=(PATHS.find(x=>role.toLowerCase().includes(x[0].toLowerCase()))||[0,[]])[1];
const sk=[...p.skills].sort((a,b)=>keys.some(k=>k.toLowerCase()==b.toLowerCase())-keys.some(k=>k.toLowerCase()==a.toLowerCase()));
const miss=['Contact details'];
let edu=[[p.degree,p.branch].filter(Boolean).join(' in '),p.college].filter(Boolean).join(' — ');if(!edu){edu='[Add your degree and college]';miss.push('Education')}
if(p.year)edu+='\nYear of study: '+p.year;if(p.cgpa){edu+=`\nCGPA: ${p.cgpa} [confirm grading scale, e.g. /10]`;miss.push('CGPA grading scale')}
let exp=p.exp;if(!exp){exp='[Add 1–2 projects: what you built, tools used, and a result you can verify]';miss.push('Projects and experience')}
if(!sk.length)miss.push('Skills');
S.resume={role,miss,sec:[['Contact',(p.name||'[Your name]')+'\n[Add email / phone / LinkedIn]'],['Summary',`${p.degree||'College'} student seeking a ${role} opportunity.`+(sk.length?` Skills include ${sk.slice(0,5).join(', ')}.`:'')+(p.goal?` Goal: ${p.goal}.`:'')],['Education',edu],['Skills',sk.join(' • ')||'[Add your skills]'],['Projects & Experience',exp]]};save();render()}
function share(text,title){if(navigator.share){navigator.share({title,text}).catch(()=>{})}else{navigator.clipboard&&navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard.'),()=>toast('Copy failed.'))}}
function cgpa(){const c=S.grades.reduce((a,g)=>a+g.c,0);return c>0?S.grades.reduce((a,g)=>a+g.c*g.p,0)/c:null}
function addGrade(){const n=$('#gn').value.trim(),c=parseFloat($('#gc').value),g=parseFloat($('#gp').value),max=S.scale==='custom'?parseFloat($('#cm').value):parseFloat(S.scale);
if(!n||!(c>0)){toast('Enter a name and credits above 0.');return}
if(!(g>=0)||(max>0&&g>max)){toast('Grade points must be between 0 and '+(max||'your max')+'.');return}
if(S.edit!=null){S.grades=S.grades.map(x=>x.id===S.edit?{id:x.id,n,c,p:g}:x);S.edit=null}else S.grades.push({id:Date.now(),n,c,p:g});save();render()}
function toggleSave(id){const i=S.saved.findIndex(x=>x.id===id);if(i>=0)S.saved.splice(i,1);else{if(!S.plus&&S.saved.length>=3){toast('Free plan saves up to 3 opportunities. Remove one or try Parama Plus.');return}const o=O.find(x=>x.id===id);S.saved.push({id,status:'Saved',dl:o.dl,notes:''})}save();render()}
function setApp(id,k,v){const a=S.saved.find(x=>x.id===id);a[k]=v;save()}
function openOpp(id){const o=O.find(x=>x.id===id);if(confirm(`You're about to leave Parama to view "${o.title}". Parama won't submit anything for you; check eligibility and the deadline yourself first.\n\nThis is sample data, so there is no real page to open. Continue?`))toast('Sample listing: no real page exists. Real listings would open the source link here.')}
function saveProfile(){const v=id=>$('#'+id).value.trim();if(!v('f_name')){toast('Please enter your name.');return}
if(v('f_cgpa')&&isNaN(Number(v('f_cgpa')))){toast('CGPA must be a number, or leave it blank.');return}
S.p={name:v('f_name'),college:v('f_college'),degree:v('f_degree'),branch:v('f_branch'),year:v('f_year'),skills:csv(v('f_skills')),roles:csv(v('f_roles')),locations:csv(v('f_loc')),cgpa:v('f_cgpa'),goal:v('f_goal'),exp:v('f_exp')};save();go('home')}
function wipe(){if(confirm('Delete your profile, saved opportunities and grades from this browser?')){try{localStorage.removeItem('parama')}catch(e){}S={...S,p:null,saved:[],grades:[],chat:[],resume:null,tab:'home',plus:false,vers:[],freeRole:'',iv:null,jdr:null,cover:''};render()}}

// ---------- Parama Plus (demo billing) + premium tools
const PRICE='₹199 / month (demo price)';
const UP=`<button class="t" onclick="go('plus')">⭐ Week-by-week roadmap in Plus</button>`;
function lock(why){return`<div class="card pc"><b>⭐ Parama Plus feature</b><p>${why}</p><button class="p" onclick="go('plus')">See Parama Plus</button></div>`}
function subscribe(){S.plus=true;save();toast('Parama Plus is active (demo, nothing charged).');render()}
function cancelPlus(){if(confirm('Cancel Parama Plus (demo)? Your data stays.')){S.plus=false;save();render()}}
function vPlus(){return`<button class="t" onclick="go('profile')">← Back</button><h1>Parama Plus ⭐</h1>
<div class="card"><b>Free</b><p class="mut">Profile, CGPA calculator, 5 AI questions, 3 saved opportunities, 1 resume target, 1 practice question, short roadmap.</p></div>
<div class="card pc"><b>Plus adds</b><ul><li>Unlimited AI questions</li><li>Unlimited saved opportunities</li><li>Tailored resume versions for every role</li><li>Week-by-week roadmaps</li><li>Full 5-question mock interviews with feedback</li><li>Job match checker</li><li>Cover letter drafts</li></ul></div>
<div class="card"><b style="font-size:1.3rem">${PRICE}</b><p class="mut">Renews monthly until cancelled; cancel any time. Demo mode: nothing is charged and no payment details are collected. In the Android app, billing runs through Google Play via RevenueCat.</p></div>
${S.plus?`<p><b>Parama Plus is active.</b></p><button class="w" onclick="cancelPlus()">Cancel Plus (demo)</button>`:`<button class="p w" onclick="subscribe()">Start Parama Plus (demo)</button>`}
<p class="mut">Your profile data stays viewable and exportable on every plan.</p>`}

function verHtml(){if(!S.plus)return`<p class="mut">⭐ Plus: save a tailored version for each role.</p>`;
return`<button class="w" onclick="saveVer()">Save as version</button>${S.vers.map((v,i)=>`<div class="card row"><div style="flex:3"><b>${esc(v.role)}</b></div><button onclick="loadVer(${i})">Load</button><button onclick="S.vers.splice(${i},1);save();render()">Delete</button></div>`).join('')}`}
function saveVer(){S.vers.push(JSON.parse(JSON.stringify(S.resume)));save();toast('Version saved.')}
function loadVer(i){S.resume=JSON.parse(JSON.stringify(S.vers[i]));save();render()}

const QS={
and:['Walk me through an app or project you built. What was your part?','How would you handle a screen rotation or process death in an Android app?','How would you structure an app into layers, and why?','Tell me about a bug that took long to fix. How did you solve it?','Why this internship, and what do you want to learn?'],
dat:['Walk me through a data project: question, data, method, result.','How would you find and handle missing values?','Explain a SQL JOIN to a non-technical teammate.','A chart shows sales up but profit down. What do you check?','Why data analysis for your career?'],
sw:['Walk me through a project you built and your part in it.','Explain a data structure you used and why.','How do you debug something that works on your laptop but fails elsewhere?','Tell me about teamwork on a project. What went wrong?','Where do you want to be in two years?'],
gen:['Tell me about yourself.','Describe a project or achievement you are proud of.','Tell me about a time you worked in a team.','Describe a mistake and what you learned.','Why this role?']};
function qset(r){r=r.toLowerCase();return /android|mobile/.test(r)?QS.and:/data|analy/.test(r)?QS.dat:/software|developer|engineer/.test(r)?QS.sw:QS.gen}
function fb(a){const w=a.trim().split(/\s+/).filter(Boolean).length,t=a.toLowerCase();let sc=2;const g=[],im=[];
if(w>=40&&w<=180){sc+=2;g.push('Good length: detailed but focused.')}else if(w<40)im.push('Add detail: aim for about 60-120 words (30-90 seconds spoken).');else{sc+=1;im.push('Trim it: long answers lose the listener. Keep the key points.')}
if(/\bi (built|made|wrote|led|designed|fixed|created|implemented|learned|used|worked)\b/.test(t)){sc+=2;g.push('You said what YOU did, which interviewers look for.')}else im.push('Use "I" statements: what exactly did you do, not just the team?');
if(/\d/.test(a)){sc+=1;g.push('A real number makes the answer concrete.')}else im.push('Add one real, verifiable number or outcome if you have one.');
if(/(because|so that|result|resulted|learned|improved|reduced|helped)/.test(t)){sc+=2;g.push('You explained the reasoning or result.')}else im.push('End with the result or what you learned.');
if(/(situation|task|first|then|finally|after that)/.test(t))sc+=1;
return{sc:Math.min(10,sc),g,im}}
